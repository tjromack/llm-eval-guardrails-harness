<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}LLM Eval &amp; Guardrails Harness{% endblock %}</title>
  <!-- HTMX for partial updates (run results, diff view) in later phases. -->
  <script src="https://unpkg.com/htmx.org@1.9.12" defer></script>
  <style>
    :root { --bg:#0f1117; --panel:#171a22; --ink:#e7e9ee; --muted:#9aa3b2;
            --line:#262b36; --ok:#3fb950; --accent:#6ea8fe; }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--bg); color:var(--ink);
           font:15px/1.5 ui-sans-serif,system-ui,Segoe UI,Roboto,sans-serif; }
    header { border-bottom:1px solid var(--line); padding:14px 22px;
             display:flex; align-items:baseline; gap:12px; }
    header h1 { font-size:16px; margin:0; font-weight:600; }
    header .meta { color:var(--muted); font-size:12.5px; }
    main { max-width:980px; margin:0 auto; padding:26px 22px; }
    .panel { background:var(--panel); border:1px solid var(--line);
             border-radius:10px; padding:18px 20px; margin-bottom:18px; }
    .panel h2 { font-size:14px; margin:0 0 8px; color:var(--accent); }
    code { background:#0b0d12; border:1px solid var(--line); border-radius:5px;
           padding:1px 6px; font-size:13px; }
    .muted { color:var(--muted); }
    a { color:var(--accent); }
  </style>
</head>
<body>
  <header>
    <h1>LLM Eval &amp; Guardrails Harness</h1>
    <span class="meta">v{{ version }} · target: {{ target_version }} · judge: {{ provider }}/{{ judge_model }}</span>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
