<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}LLM Eval &amp; Guardrails Harness{% endblock %}</title>
  <!-- HTMX for partial updates (run results, diff view) in later phases. -->
  <script src="https://unpkg.com/htmx.org@1.9.12" defer></script>
  <style>
    :root { --bg:#0f1117; --panel:#171a22; --ink:#e7e9ee; --muted:#9aa3b2;
            --line:#262b36; --ok:#3fb950; --bad:#f85149; --warn:#d29922;
            --accent:#6ea8fe; }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--bg); color:var(--ink);
           font:15px/1.5 ui-sans-serif,system-ui,Segoe UI,Roboto,sans-serif; }
    header { border-bottom:1px solid var(--line); padding:14px 22px;
             display:flex; align-items:baseline; gap:12px; }
    header h1 { font-size:16px; margin:0; font-weight:600; }
    header .meta { color:var(--muted); font-size:12.5px; }
    main { max-width:980px; margin:0 auto; padding:26px 22px; }
    .panel { background:var(--panel); border:1px solid var(--line);
             border-radius:10px; padding:18px 20px; margin-bottom:18px; }
    .panel h2 { font-size:14px; margin:0 0 8px; color:var(--accent); }
    code { background:#0b0d12; border:1px solid var(--line); border-radius:5px;
           padding:1px 6px; font-size:13px; }
    .muted { color:var(--muted); }
    a { color:var(--accent); text-decoration:none; }
    a:hover { text-decoration:underline; }
    table { width:100%; border-collapse:collapse; font-size:13.5px; }
    th, td { text-align:left; padding:7px 10px; border-bottom:1px solid var(--line); }
    th { color:var(--muted); font-weight:600; font-size:12px; text-transform:uppercase;
         letter-spacing:.03em; }
    .badge { display:inline-block; padding:1px 8px; border-radius:20px; font-size:12px;
             font-weight:600; border:1px solid var(--line); }
    .badge.pass { color:#0b0d12; background:var(--ok); border-color:var(--ok); }
    .badge.fail { color:#fff; background:var(--bad); border-color:var(--bad); }
    .badge.warn { color:#0b0d12; background:var(--warn); border-color:var(--warn); }
    .badge.layer { color:var(--muted); background:transparent; }
    .pill { font-size:11px; color:var(--muted); border:1px solid var(--line);
            border-radius:6px; padding:1px 6px; }
    .tag-rule { color:#9aa3b2; } .tag-judge { color:#c9a3fe; }
    .ok { color:var(--ok); } .bad { color:var(--bad); }
    .banner { border-radius:10px; padding:14px 18px; margin-bottom:18px; font-weight:600; }
    .banner.flag { background:#3a0d12; border:1px solid var(--bad); color:#ffb3ba; }
    .banner.clear { background:#0d2a16; border:1px solid var(--ok); color:#b7f3c8; }
    .row { display:flex; gap:18px; flex-wrap:wrap; }
    .row > .panel { flex:1; min-width:280px; }
    .num { font-variant-numeric:tabular-nums; }
    form.inline { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
    input, select, button { background:#0b0d12; color:var(--ink); border:1px solid var(--line);
            border-radius:6px; padding:6px 9px; font-size:13px; }
    button { background:var(--accent); color:#06122e; border-color:var(--accent);
             font-weight:600; cursor:pointer; }
  </style>
</head>
<body>
  <header>
    <h1>LLM Eval &amp; Guardrails Harness</h1>
    <span class="meta">v{{ version }} · target: {{ target_version }} · judge: {{ provider }}/{{ judge_model }}</span>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
